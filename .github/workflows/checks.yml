name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project runtime --locked
      - run: uv run --project runtime --locked python -m unittest discover -s runtime -p 'test_*.py' -v
      - run: uv export --project runtime --locked --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
      - run: uv tool run pip-audit -r /tmp/runtime-requirements.txt --no-deps --disable-pip
