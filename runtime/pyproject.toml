[project]
name = "visual-lab-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "transformers==5.22.1",
    "torch==2.8.0",
    "langchain==1.4.3",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
